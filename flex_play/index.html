<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Learn Flexbox & Flex-Grow</title>
    <!-- Linking our external stylesheet -->
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <h1>Mastering CSS Flexbox</h1>

    <!-- The Flex Container -->
    <div class="flex-container">
      <!-- The Flex Items -->
      <div class="box box-1">Box 1 (Grow: 1)</div>
      <div class="box box-2">Box 2 (Grow: 2)</div>
      <div class="box box-3">Box 3 (Grow: 1)</div>
      <div class="box box-4">Box 4 (Grow: 1)</div>
    </div>
  </body>
</html>
