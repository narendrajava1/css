<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meritt - Profile Card</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://kit.fontawesome.com/7f5493cf2f.js" crossorigin="anonymous"></script>
</head>
<body>
    <section>
        <div class="personal">
            <span class="badge">PRO</span>
            <img src="./meritt.jpg" alt="Meritt Profile Picture">
            <h1 class="name">Meritt</h1>
            <p class="location">INDIA</p>
            <p class="title">Full Stack Developer</p>
            <div class="buttons">
                <button class="primary">Message</button>
                <button class="secondary">Following</button>
            </div>
            <div class="social-icons">
                <a href="#"><i class="fa-brands fa-square-instagram"></i></a>
                <a href="#"><i class="fa-brands fa-square-github"></i></a>
                <a href="#"><i class="fa-brands fa-square-youtube"></i></a>
                <a href="#"><i class="fa-brands fa-square-facebook"></i></a>
                <a href="#"><i class="fa-brands fa-square-twitter"></i></a>
                <a href="#"><i class="fa-brands fa-square-linkedin"></i></a>
            </div>
        </div>
        <div class="skill">
            <h2>Skills</h2>
            <ul>
                <li>Python</li>
                <li>JavaScript</li>
                <li>HTML</li>
                <li>CSS</li>
                <li>React</li>
                <li>Node.js</li>
            </ul>
        </div>
    </section>
</body>
</html>
