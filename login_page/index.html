<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Login</title>
    <link rel="stylesheet" href="style.css" />
    <script
      src="https://kit.fontawesome.com/7f5493cf2f.js"
      crossorigin="anonymous"
    ></script>
  </head>
  <body>
    <section class="login-container">
      <h1>Login</h1>
      <form action>
        <input
          type="text"
          name="username"
          id="username"
          class="form-input"
          placeholder="Username"
        />
        <input
          type="password"
          name="password"
          id="password"
          class="form-input"
          placeholder="Password"
        />
        <a href="/reset-password" class="forgot-password"
          >Forgot your password?</a
        >
        <button type="submit" id="loginButton" class="form-input-btn">
          Login
        </button>
        <span>Not registered? <a href="/signup">Sign up</a></span>
      </form>
    </section>
    <i class="fa-brands fa-square-whatsapp"></i>
  </body>
</html>
